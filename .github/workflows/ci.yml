name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm run build
        env:
          # valores fictícios só para o build passar (o build pré-renderiza a
          # tela de login e o cliente Supabase reclama de string vazia)
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          PLATFORM_ADMIN_EMAILS: ci@example.com
